<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 270px;
      margin: 0;
      padding: 14px;
      background: #11141c;
      color: #e5e7eb;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    h2 {
      margin: 0;
      font-size: 15px;
      color: #f6c531;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      background: #374151;
      color: #9ca3af;
    }
    .badge.running {
      background: #065f46;
      color: #34d399;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .select-sm {
      background: #1e2430;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 12px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn-start { background: #059669; color: white; }
    .btn-start:hover { background: #047857; }
    .btn-stop { background: #dc2626; color: white; }
    .btn-stop:hover { background: #b91c1c; }
    .btn-hud { background: #374151; color: #f6c531; margin-top: 6px; }
    .btn-hud:hover { background: #4b5563; }
    .hint {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>⚔️ Pixlaria Bot</h2>
    <span id="bot-status" class="badge">DISCONNECTED</span>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:6px;">
      <label for="human-toggle"><strong>🧠 Humanizer</strong></label>
      <input type="checkbox" id="human-toggle" checked>
    </div>
    <div class="row" style="margin-bottom:0;">
      <label for="human-profile" style="font-size:12px;color:#9ca3af;">Profile</label>
      <select id="human-profile" class="select-sm">
        <option value="natural">Natural (Balanced)</option>
        <option value="gamer">Gamer (Fast)</option>
        <option value="stealth">Stealth (Safe)</option>
      </select>
    </div>
  </div>

  <div class="row">
    <label for="auto-fight">Auto-Combat</label>
    <input type="checkbox" id="auto-fight" checked>
  </div>

  <div class="row">
    <label for="auto-spell">Auto-Cast Skill/Spell</label>
    <input type="checkbox" id="auto-spell" checked>
  </div>

  <div class="row">
    <label for="auto-skill">Auto-Skilling (Gather/Craft/Fire)</label>
    <input type="checkbox" id="auto-skill">
  </div>

  <div class="row">
    <label for="auto-loot">Auto-Loot</label>
    <input type="checkbox" id="auto-loot" checked>
  </div>

  <div class="row">
    <label for="auto-eat">Auto-Eat (&lt; 50% HP)</label>
    <input type="checkbox" id="auto-eat" checked>
  </div>

  <div class="row">
    <label for="auto-cavebot">Cavebot (Waypoints)</label>
    <input type="checkbox" id="auto-cavebot">
  </div>

  <div class="row">
    <label for="auto-haste">Auto-Haste (Recast 40s)</label>
    <input type="checkbox" id="auto-haste">
  </div>

  <div class="row">
    <label for="box-radar">Supply Box Radar (Key: B)</label>
    <input type="checkbox" id="box-radar" checked>
  </div>

  <div class="row">
    <label for="anti-inactivity">Anti-Inactivity (Anti-AFK)</label>
    <input type="checkbox" id="anti-inactivity" checked>
  </div>

  <button id="master-btn" class="btn btn-start">Start Bot</button>
  <button id="toggle-hud-btn" class="btn btn-hud">Toggle In-Game HUD (~)</button>

  <div class="hint">Press <b>~</b> in-game to toggle the floating panel</div>

  <script src="popup.js"></script>
</body>
</html>
